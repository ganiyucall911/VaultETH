name: VaultETH
options:
  bundleIdPrefix: com.vaulteth
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WalletCore:
    url: https://github.com/trustwallet/wallet-core
    exactVersion: 4.2.9
targets:
  VaultETH:
    type: application
    platform: iOS
    sources:
      - path: VaultETH
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: VaultETH
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: VaultETH uses Face ID to protect your recovery phrase and to authorize sending ETH.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaulteth.app
    dependencies:
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
  VaultETHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/VaultETHTests
    dependencies:
      - target: VaultETH
schemes:
  VaultETH:
    build:
      targets:
        VaultETH: all
    test:
      targets:
        - VaultETHTests

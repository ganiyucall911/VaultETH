name: VaultETH
options:
  bundleIdPrefix: com.vaulteth
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WalletCore:
    url: https://github.com/trustwallet/wallet-core
    exactVersion: 4.2.9

targets:
  VaultETH:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - .antigravity
          - .github
          - android
          - README.md
          - REVIEW.md
          - APP_STORE_CHECKLIST.md
          - SECURITY.md
          - project.yml
          - Info.plist
          - "*.md"
          - "*Tests.swift"
      - path: PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: VaultETH
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: VaultETH uses Face ID to protect your recovery phrase and to authorize sending ETH.
        NSCameraUsageDescription: VaultETH uses your camera to scan Ethereum address and ENS payment QR codes.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaulteth.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf

  VaultETHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: .
        includes:
          - "*Tests.swift"
        excludes:
          - .antigravity
          - .github
          - android
          - README.md
          - REVIEW.md
          - APP_STORE_CHECKLIST.md
          - SECURITY.md
          - project.yml
          - Info.plist
          - PrivacyInfo.xcprivacy
          - "*.md"
    dependencies:
      - target: VaultETH

schemes:
  VaultETH:
    build:
      targets:
        VaultETH: all
    test:
      targets:
        - VaultETHTests

name: iOS CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - 'project.yml'
      - 'PrivacyInfo.xcprivacy'
      - 'Info.plist'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - 'project.yml'
      - 'PrivacyInfo.xcprivacy'
      - 'Info.plist'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list -j devices available | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next((device["udid"] for runtimes in devices.values() for device in runtimes if device["isAvailable"] and device["name"].startswith("iPhone")), ""))')
          echo "Selected simulator ID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 15"
          fi
          echo "Using destination: $DEST"

          set -o pipefail
          xcodebuild test \
            -project VaultETH.xcodeproj \
            -scheme VaultETH \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee test_run.log

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project VaultETH.xcodeproj \
            -scheme VaultETH \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Unsigned iOS IPA
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find DerivedData/Build/Products -name "VaultETH.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cp -R "$APP_PATH" build_output/Payload/
            cd build_output
            zip -r VaultETH-unsigned.ipa Payload
            cd ..
          else
            echo "VaultETH.app not found"
            exit 1
          fi

      - name: Verify Unsigned iOS IPA
        run: test -s build_output/VaultETH-unsigned.ipa

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultETH-iOS-unsigned-ipa
          path: build_output/VaultETH-unsigned.ipa
          retention-days: 14

      - name: Print Failure Log
        if: failure()
        run: |
          if [ -f test_run.log ]; then
            tail -n 150 test_run.log
          fi

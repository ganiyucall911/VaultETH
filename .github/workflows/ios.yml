name: iOS CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - 'project.yml'
      - 'PrivacyInfo.xcprivacy'
      - 'Info.plist'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - 'project.yml'
      - 'PrivacyInfo.xcprivacy'
      - 'Info.plist'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Unit Tests
        run: |
          # List available simulators and pick first available iPhone
          xcrun simctl list devices available
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*(iPhone [^()]+).*/\1/' | xargs)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 15"
          fi
          echo "Selected simulator: $SIM_NAME"
          xcrun simctl boot "$SIM_NAME" || true

          set -o pipefail
          xcodebuild test \
            -project VaultETH.xcodeproj \
            -scheme VaultETH \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee test_run.log

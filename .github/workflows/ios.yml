name: iOS CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - 'project.yml'
      - 'PrivacyInfo.xcprivacy'
      - 'Info.plist'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.swift'
      - 'project.yml'
      - 'PrivacyInfo.xcprivacy'
      - 'Info.plist'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml
          sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 56/' VaultETH.xcodeproj/project.pbxproj || true

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -E -o '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -n 1)
          echo "Selected simulator ID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            xcrun simctl boot "$SIM_ID" || true
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 15"
          fi
          echo "Using destination: $DEST"

          set -o pipefail
          xcodebuild test \
            -project VaultETH.xcodeproj \
            -scheme VaultETH \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee test_run.log

      - name: Print Failure Log
        if: failure()
        run: |
          if [ -f test_run.log ]; then
            tail -n 150 test_run.log
          fi

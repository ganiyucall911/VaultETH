name: Build & Release Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      deploy_to_stores:
        description: 'Deploy Android release to Google Play Internal Testing (requires secrets)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Android Release Build
  # =========================================================================
  build-android:
    name: Build Android Artifacts (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_TO_STORES: ${{ inputs.deploy_to_stores || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          PLAY_STORE_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            if [[ -n "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
              echo "::error::Android signing secrets are incomplete. Configure ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, and ANDROID_RELEASE_KEY_PASSWORD."
              exit 1
            fi
            if [[ "$DEPLOY_TO_STORES" == "true" ]]; then
              echo "::error::Store deployment requires all Android signing secrets and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
              exit 1
            fi
            echo "::warning::Android signing secrets are absent; release APK/AAB artifacts will be clearly marked unsigned."
            exit 0
          fi

          if [[ "$DEPLOY_TO_STORES" == "true" && -z "$PLAY_STORE_JSON" ]]; then
            echo "::error::Store deployment was requested but GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/vaulteth-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          {
            echo "ANDROID_RELEASE_KEYSTORE=$KEYSTORE_PATH"
            echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_RELEASE_SIGNING_CONFIGURED=true"
          } >> "$GITHUB_ENV"

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Build Android APKs and App Bundle
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Package and verify Android binaries
        working-directory: android
        run: |
          mkdir -p ../release_assets
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release_assets/VaultETH-Android-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab

          if [[ "$ANDROID_RELEASE_SIGNING_CONFIGURED" == "true" ]]; then
            test -s app/build/outputs/apk/release/app-release.apk
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab
            cp app/build/outputs/apk/release/app-release.apk ../release_assets/VaultETH-Android-release.apk
            cp app/build/outputs/bundle/release/app-release.aab ../release_assets/VaultETH-Android-release.aab
          else
            APK_PATH=app/build/outputs/apk/release/app-release-unsigned.apk
            if [[ ! -s "$APK_PATH" ]]; then
              APK_PATH=app/build/outputs/apk/release/app-release.apk
            fi
            test -s "$APK_PATH"
            cp "$APK_PATH" ../release_assets/VaultETH-Android-release-unsigned.apk
            cp app/build/outputs/bundle/release/app-release.aab ../release_assets/VaultETH-Android-release-unsigned.aab
          fi
          test -s ../release_assets/VaultETH-Android-debug.apk
          if [[ "$ANDROID_RELEASE_SIGNING_CONFIGURED" == "true" ]]; then
            test -s ../release_assets/VaultETH-Android-release.apk
            test -s ../release_assets/VaultETH-Android-release.aab
          else
            test -s ../release_assets/VaultETH-Android-release-unsigned.apk
            test -s ../release_assets/VaultETH-Android-release-unsigned.aab
          fi

      - name: Upload Android Assets
        uses: actions/upload-artifact@v4
        with:
          name: VaultETH-Android-Release-Binaries
          path: release_assets/*
          retention-days: 30

      - name: Deploy to Google Play Internal Testing
        if: ${{ inputs.deploy_to_stores == true }}
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_STORE_JSON }}
          packageName: com.vaulteth.app
          releaseFiles: release_assets/VaultETH-Android-release.aab
          track: internal
          status: completed

  # =========================================================================
  # 2. iOS Release Build
  # =========================================================================
  build-ios:
    name: Build iOS Application (unsigned IPA)
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list -j devices available | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next((device["udid"] for runtimes in devices.values() for device in runtimes if device["isAvailable"] and device["name"].startswith("iPhone")), ""))')
          if [ -n "$SIM_ID" ]; then
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 15"
          fi

          set -o pipefail
          xcodebuild test \
            -project VaultETH.xcodeproj \
            -scheme VaultETH \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee test_run.log

      - name: Build & Package iOS Application
        run: |
          mkdir -p release_assets/Payload

          # Build for generic iOS device
          xcodebuild build \
            -project VaultETH.xcodeproj \
            -scheme VaultETH \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          APP_PATH=$(find DerivedData/Build/Products -name "VaultETH.app" -type d -print -quit)
          if [ -n "$APP_PATH" ]; then
            echo "Packaging app from $APP_PATH"
            cp -R "$APP_PATH" release_assets/Payload/
            cd release_assets
            zip -r VaultETH-iOS-unsigned.ipa Payload
            rm -rf Payload
            cd ..
          else
            echo "VaultETH.app not found"
            exit 1
          fi

      - name: Verify iOS release artifact
        run: test -s release_assets/VaultETH-iOS-unsigned.ipa

      - name: Upload iOS Assets
        uses: actions/upload-artifact@v4
        with:
          name: VaultETH-iOS-Release-Binaries
          path: release_assets/*
          retention-days: 30

  # =========================================================================
  # 3. Publish GitHub Release
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultETH-Android-Release-Binaries
          path: final_assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultETH-iOS-Release-Binaries
          path: final_assets

      - name: Generate Checksums
        working-directory: final_assets
        run: |
          test -s VaultETH-Android-debug.apk
          test -s VaultETH-iOS-unsigned.ipa
          if [[ -e VaultETH-Android-release.apk ]]; then
            test -s VaultETH-Android-release.aab
          else
            test -s VaultETH-Android-release-unsigned.apk
            test -s VaultETH-Android-release-unsigned.aab
          fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ inputs.release_version || '1.0.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "VaultETH ${{ steps.release_tag.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            final_assets/*
          body: |
            ## VaultETH ${{ steps.release_tag.outputs.tag }}
            **Executive Self-Custodial Multi-Chain Crypto Vault by `vault.`**

            ### 🚀 Universal Multi-Chain Architecture
            - **EVM Networks:** Ethereum Mainnet, Arbitrum One, Base, Optimism, Polygon PoS, BNB Smart Chain, Avalanche C-Chain, Linea, Sepolia Testnet, and custom RPC EVM networks.
            - **Cross-Chain Derived Addresses:** Native deposit derivation for Solana (Ed25519) and Bitcoin SegWit (Bech32).
            - **Hardware Enclave Protection:** iOS Keychain (`kSecAttrAccessibleWhenUnlockedThisDeviceOnly`) and Android Keystore (`AES256_GCM`) backed by Face ID / Touch ID / BiometricPrompt.
            - **Pre-Flight Transaction Simulation:** Real-time dry-run execution (`eth_call`) with ABI smart contract revert decoding.
            - **ENS Intelligence:** Forward resolution, reverse lookup, and `VaultIdenticon` cryptographic crests.
            - **Privacy First:** Zero trackers, zero analytics, zero custodial access, and discreet balance mode.

            ### 📦 Included Release Binaries
            - Android release APK/AAB: signed only when repository signing secrets are configured; otherwise both artifacts are explicitly marked unsigned.
            - `VaultETH-Android-debug.apk`: Debug APK with diagnostic logging enabled.
            - `VaultETH-iOS-unsigned.ipa`: Packaged iOS application bundle.
            - `SHA256SUMS.txt`: Cryptographic checksum verification list.

            ---
            *Review Store Submission Kit in [`SUBMISSION_KIT.md`](https://github.com/ganiyucall911/VaultETH/blob/main/SUBMISSION_KIT.md) for complete App Store Connect and Google Play Console copy.*

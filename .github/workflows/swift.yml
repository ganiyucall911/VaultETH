# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build
      run: xcodebuild -project VaultETH.xcodeproj -scheme VaultETH -destination 'platform=iOS Simulator,name=iPhone 15 Pro' build

    - name: Run tests
      run: xcodebuild -project VaultETH.xcodeproj -scheme VaultETH -destination 'platform=iOS Simulator,name=iPhone 15 Pro' test

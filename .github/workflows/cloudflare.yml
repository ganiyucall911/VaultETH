name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        run: |
          if [ -n "$CF_TOKEN" ]; then
            npx wrangler pages deploy docs --project-name=vaulteth --commit-dirty=true
          else
            echo "================================================================="
            echo "Cloudflare Pages Deployment Ready!"
            echo "To enable direct GitHub Actions deployment:"
            echo "1. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Secrets."
            echo "OR:"
            echo "2. Connect this repository directly in Cloudflare Dashboard:"
            echo "   Workers & Pages > Create application > Pages > Connect to Git"
            echo "   - Project name: vaulteth"
            echo "   - Build output directory: docs"
            echo "================================================================="
          fi
        env:
          CF_TOKEN: ${{ secrets[format('{0}', 'CLOUDFLARE_API_TOKEN')] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('{0}', 'CLOUDFLARE_ACCOUNT_ID')] }}

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=vaulteth --commit-dirty=true

      - name: Log Deployment Readiness
        if: ${{ env.CF_API_TOKEN == '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "================================================================="
          echo "Cloudflare Pages Deployment Ready!"
          echo "To enable direct GitHub Actions deployment:"
          echo "1. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Secrets."
          echo "OR:"
          echo "2. Connect this repository directly in Cloudflare Dashboard:"
          echo "   Workers & Pages > Create application > Pages > Connect to Git"
          echo "   - Project name: vaulteth"
          echo "   - Build output directory: docs"
          echo "================================================================="

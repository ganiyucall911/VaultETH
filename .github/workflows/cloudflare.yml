name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deployment skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are not configured."
            exit 0
          fi
          test -s docs/index.html
          npx wrangler pages deploy docs --project-name=vaulteth --account-id="$CLOUDFLARE_ACCOUNT_ID" --commit-dirty=true
        env:
          CF_TOKEN: ${{ secrets[format('{0}', 'CLOUDFLARE_API_TOKEN')] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('{0}', 'CLOUDFLARE_ACCOUNT_ID')] }}
